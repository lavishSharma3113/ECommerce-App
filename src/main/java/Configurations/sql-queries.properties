QUERY_USER_LOGIN=SELECT user_id, username FROM user WHERE username = ? AND password = ?
QUERY_USER_REGISTER=INSERT INTO users (username, password, email, created_at) VALUES (?, ?, ?, NOW())
Query_GET_ALL_PRODUCT=SELECT * FROM product
QUERY_GET_USER_ORDER_HISTORY=SELECT order_id, total_amount, order_date FROM `Order` WHERE user_id = ? ORDER BY order_date DESC
QUERY_GET_USER_ORDER_HISTORY_DETAILS=SELECT oi.quantity, oi.price, p.name FROM order_item oi JOIN product p ON oi.product_id = p.product_id WHERE oi.order_id = ?
QUERY_CREATE_ORDER=INSERT INTO `Order` (user_id, total_amount, order_date) VALUES (?, ?, NOW())
QUERY_CREATE_ORDER_ITEM=INSERT INTO order_item (order_id, product_id, quantity, price) VALUES (?, ?, ?, ?)
QUERY_UPDATE_PRODUCT_STOCK=UPDATE product SET stock_quantity = stock_quantity - ? WHERE product_id = ?
QUERY_GET_CART=SELECT c.cart_id, p.product_id, p.name, p.price, c.quantity FROM cart c JOIN product p ON c.product_id = p.product_id WHERE c.user_id = ?
QUERY_GET_CART_QUANTITY=SELECT quantity FROM cart WHERE user_id = ? AND product_id = ?
QUERY_UPDATE_CART=UPDATE cart SET quantity = ? WHERE user_id = ? AND product_id = ?
QUERY_INSERT_CART_ITEM=INSERT INTO cart (user_id, product_id, quantity) VALUES (?, ?, ?)
QUERY_DELETE_CART=DELETE FROM cart WHERE cart_id = ? AND user_id = ?
QUERY_CLEAR_CART=DELETE FROM cart WHERE user_id = ?
QUERY_USER_SIGNUP=INSERT INTO user (username, password, email) VALUES (?, ?, ?)
QUERY_CHECK_USERNAME=SELECT username FROM user WHERE username = ?